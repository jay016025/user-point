spring:
  application:
    name: user-points-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/taskdb?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      jakarta.persistence.query.timeout: 5000
  sql:
    init:
      mode: always
  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s
  jackson:
    deserialization:
      accept-float-as-int: false
rocketmq:
  name-server: ${ROCKETMQ_NAMESERVER:localhost:9876}
  producer-group: ${ROCKETMQ_PRODUCER_GROUP:user-points-producer}
  topic: user-points-topic
  send-timeout-ms: 3000
points:
  cache-ttl: 60s
  outbox:
    enabled: true
    delay-ms: 1000
    batch-size: 50
